<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>BattleMetrics Hour Summary Extension Settings</title>
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <div class="wrapper">
            <div class="center-card">
                <h1 id="title">BattleMetrics Hour Summary</h1>
                <h2 id="subtitle">Settings</h2>

                <div class="options-wrapper">
                    <form id="options-form">
                        <!-- Auto-populated -->
                    </form>
                    <div class="status-wrapper">
                        <p id="status-text"></p>
                    </div>
                </div>
                <div class="footer">
                    <a
                        href="https://github.com/jxtt-dev/battlemetrics_hour_summary"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        GitHub
                    </a>
                    <p id="popup-version-text">
                        <span id="version-number">0.0.0</span>
                    </p>
                </div>
            </div>
        </div>
        <script src="../options.js"></script>
    </body>
</html>
